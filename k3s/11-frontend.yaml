apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: learning-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: kadhemsellami/elearning-frontend-image:v1.0  # My registry's custom built image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "http://localhost"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 7
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 7
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: learning-platform
spec:
  selector:
    app: frontend
  ports:
  - port: 3000
    targetPort: 3000
    name: http